<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#e0899c">
    <title>Francine Veronica's Christening</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Fraunces:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Envelope Introduction -->
    <div class="envelope-intro" id="envelopeIntro">
        <!-- Background floating hearts -->
        <div class="envelope-bg-hearts">
            <span class="bg-heart">♡</span>
            <span class="bg-heart">♡</span>
            <span class="bg-heart">♡</span>
            <span class="bg-heart">♡</span>
            <span class="bg-heart">♡</span>
            <span class="bg-heart">♡</span>
            <span class="bg-heart">♡</span>
            <span class="bg-heart">♡</span>
        </div>

        <!-- Closed envelope with wax seal -->
        <div class="envelope-stage envelope-stage-closed" id="envelopeClosedStage">
            <div class="closed-envelope-wrap">
                <div class="closed-envelope-photo-wrap">
                    <img src="images/envelope/closed-envelope.png" alt="Envelope" class="closed-envelope-img" id="closedEnvelopeImg">
                    <button type="button" class="wax-seal-btn" id="waxSealBtn" aria-label="Open invitation">
                        <img src="images/envelope/wax-seal.png" alt="" class="wax-seal-img">
                    </button>
                </div>
                <img src="images/envelope/closed-envelope-below.png" alt="" class="envelope-bottom-decoration" id="envelopeBottomDecoration">
            </div>
        </div>
    </div>

    <!-- Page Loader - covers everything (including the envelope) until every
         page resource has finished loading, then fades out. -->
    <div class="page-loader" id="pageLoader">
        <div class="loader-content">
            <img src="images/cross.png" alt="Cross" class="loader-cross">
            <div class="loader-text">With Love...</div>
        </div>
    </div>

    <!-- Floating Background Elements -->
    <div class="floating-elements">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
    </div>

    <!-- Floating Balloon Babies (above section content, below nav/envelope) -->
    <div class="floating-balloons">
        <img src="images/frankiebaloons/baby baloons 1.png" alt="" class="balloon-float balloon-1">
        <img src="images/frankiebaloons/baby baloons 2.png" alt="" class="balloon-float balloon-2">
        <img src="images/frankiebaloons/baby baloons 3.png" alt="" class="balloon-float balloon-3">
        <img src="images/frankiebaloons/baby baloons 4.png" alt="" class="balloon-float balloon-4">
        <img src="images/frankiebaloons/baby baloons 5.png" alt="" class="balloon-float balloon-5">
    </div>

    <!-- Section Navigation Dots -->
    <nav class="section-nav">
        <div class="section-dot active" data-section="0"></div>
        <div class="section-dot" data-section="1"></div>
        <div class="section-dot" data-section="2"></div>
    </nav>

    <!-- Music Toggle - starts muted; music.js syncs this on init -->
    <button type="button" class="music-toggle-btn" id="musicToggleBtn" aria-label="Unmute music">
        <img src="images/nomusic.png" alt="No music" class="music-icon">
    </button>

    <!-- Main Container with Snap Sections -->
    <div class="container">

        <!-- Section 1: Opened envelope with letter and invitation -->
        <section class="snap-section section-envelope-open visible" data-index="0">
            <div class="snap-section-content">
                <div class="envelope-open-visual">
                    <img src="images/envelope/open-envelope.png" alt="Envelope" class="open-envelope-photo">
                    <div class="letter-card">
                        <img src="images/envelope/blank-letter.png" alt="You are cordially invited to Francine Veronica's Christening" class="blank-letter-img">
                        <img src="images/baptismpool-wobg.png" alt="" class="baptism-pool-decoration">
                    </div>
                    <img src="images/frankiebible.png" alt="Francine Veronica" class="frankie-bible-img">
                </div>
            </div>

            <!-- Scroll Indicator -->
            <div class="scroll-indicator">
                <span></span>
            </div>
        </section>

        <!-- Section 2: Details collage -->
        <section class="snap-section section-detail-collage" data-index="1">
            <div class="snap-section-content">
                <div class="detail-visual">
                    <div class="detail-frame-wrap">
                        <div class="detail-frame-slideshow">
                            <img src="images/details-section/frankiepics/6323421157121529400.jpg" alt="Francine Veronica" class="frame-slide active">
                            <img src="images/details-section/frankiepics/6323421157121529399.jpg" alt="Francine Veronica" class="frame-slide">
                            <img src="images/details-section/frankiepics/6323421157121529393.jpg" alt="Francine Veronica" class="frame-slide">
                            <img src="images/details-section/frankiepics/6323421157121529396.jpg" alt="Francine Veronica" class="frame-slide">
                            <img src="images/details-section/frankiepics/6053098930578330125.jpg" alt="Francine Veronica" class="frame-slide">
                            <img src="images/details-section/frankiepics/6053098930578330126.jpg" alt="Francine Veronica" class="frame-slide">
                            <img src="images/details-section/frankiepics/6053098930578330127.jpg" alt="Francine Veronica" class="frame-slide">
                            <img src="images/details-section/frankiepics/6053098930578330128.jpg" alt="Francine Veronica" class="frame-slide">
                            <img src="images/details-section/frankiepics/6053098930578330130.jpg" alt="Francine Veronica" class="frame-slide">
                            <img src="images/details-section/frankiepics/6053098930578330131.jpg" alt="Francine Veronica" class="frame-slide">
                            <img src="images/details-section/frankiepics/6053098930578330132.jpg" alt="Francine Veronica" class="frame-slide">
                            <img src="images/details-section/frankiepics/6053098930578330133.jpg" alt="Francine Veronica" class="frame-slide">
                            <img src="images/details-section/frankiepics/6053098930578330134.jpg" alt="Francine Veronica" class="frame-slide">
                            <img src="images/details-section/frankiepics/6053098930578330135.jpg" alt="Francine Veronica" class="frame-slide">
                            <img src="images/details-section/frankiepics/6053098930578330136.jpg" alt="Francine Veronica" class="frame-slide">
                        </div>
                        <img src="images/details-section/frame.png" alt="" class="detail-frame">
                    </div>
                    <img src="images/details-section/frankiechristeningtitle.png" alt="Frankie's Christening" class="detail-title">
                    <img src="images/details-section/potchi.png" alt="Potchi" class="detail-potchi">
                    <img src="images/details-section/chewy.png" alt="Chewy" class="detail-chewy">
                    <button type="button" class="detail-map-btn" id="detailMapBtn" aria-label="See where">
                        <img src="images/details-section/frankieandmap.png" alt="" class="detail-map-img">
                    </button>
                    <button type="button" class="detail-book-btn" id="detailBookBtn" aria-label="See date and time">
                        <img src="images/details-section/closebook.png" alt="" class="detail-book-img">
                    </button>
                </div>
            </div>
        </section>

        <!-- Section 3: Family -->
        <section class="snap-section section-family" data-index="2">
            <div class="snap-section-content">
                <div class="family-visual">
                    <img src="images/family-section/familywithtitle.png" alt="The Family" class="family-title-img">
                    <button type="button" class="family-rsvp-btn" id="familyRsvpBtn" aria-label="RSVP">
                        <img src="images/family-section/rsvp.png" alt="RSVP" class="family-rsvp-img">
                    </button>
                    <button type="button" class="family-styling-btn" id="stylingSuggestionsBtn" aria-label="See styling suggestions">
                        <img src="images/family-section/stylingsuggestions.png" alt="Styling Suggestions" class="family-styling-img">
                    </button>
                </div>
            </div>
        </section>

    </div>

    <!-- Map Overlay Modal -->
    <div class="map-overlay" id="mapOverlay">
        <div class="map-overlay-content">
            <button class="map-close-btn" id="mapCloseBtn">&times;</button>
            <div class="map-container">
                <iframe
                    id="mapIframe"
                    width="100%"
                    height="100%"
                    style="border:0;"
                    loading="lazy"
                    allowfullscreen
                    referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>
        </div>
    </div>

    <!-- RSVP Modal -->
    <div class="rsvp-overlay" id="rsvpOverlay">
        <div class="rsvp-overlay-content">
            <img src="images/family-section/rsvpletter.png" alt="" class="rsvp-letter-bg">
            <button type="button" class="rsvp-close-btn" id="rsvpCloseBtn" aria-label="Close">&times;</button>
            <img src="images/waving frankie.png" alt="Francine Veronica waving" class="rsvp-modal-img">
            <div class="rsvp-form-fields">
                <form class="rsvp-form" id="rsvpForm">
                    <label class="rsvp-field">
                        <span class="rsvp-field-label">Your Name</span>
                        <input type="text" name="guestName" placeholder="Enter your name" required>
                    </label>
                    <label class="rsvp-checkbox-row">
                        <input type="checkbox" name="bringingCar">
                        <span>I need parking.</span>
                    </label>
                </form>
            </div>
            <button type="submit" form="rsvpForm" class="rsvp-submit-btn" aria-label="Submit RSVP">
                <img src="images/family-section/submitbutton.png" alt="" class="rsvp-submit-img">
            </button>
            <div class="rsvp-loading-overlay"></div>
        </div>
    </div>

    <!-- Styling Suggestions Overlay Modal -->
    <div class="detail-popup-overlay" id="stylingSuggestionsOverlay">
        <div class="detail-popup-content">
            <button type="button" class="detail-popup-close" id="stylingSuggestionsCloseBtn" aria-label="Close">&times;</button>
            <img src="images/family-section/pastelcolors.png" alt="Pastel color styling suggestions" class="detail-popup-img">
        </div>
    </div>

    <!-- Book Overlay Modal -->
    <div class="detail-popup-overlay" id="bookOverlay">
        <div class="detail-popup-content">
            <button type="button" class="detail-popup-close" id="bookCloseBtn" aria-label="Close">&times;</button>
            <img src="images/details-section/openbook.png" alt="September 12, 2026 at 3:00 PM" class="detail-popup-img">
        </div>
    </div>

    <!-- Church Location Overlay Modal -->
    <div class="detail-popup-overlay" id="churchOverlay">
        <div class="detail-popup-content">
            <button type="button" class="detail-popup-close" id="churchCloseBtn" aria-label="Close">&times;</button>
            <div class="detail-popup-media">
                <button type="button" class="redpin-btn map-link" id="churchRedpinBtn" data-location="ceremony" aria-label="See on map">
                    <img src="images/details-section/redpin.png" alt="See on map" class="redpin-btn-img">
                </button>
                <img src="images/details-section/frankietochurch.png" alt="Christ the King Parish, Green Meadows" class="detail-popup-img" id="churchPopupImg">
                <button type="button" class="venue-swap-btn" id="receptionBtn" aria-label="See reception details">
                    <img src="images/details-section/reception.png" alt="Reception" class="venue-swap-btn-img">
                </button>
                <button type="button" class="venue-swap-btn" id="churchBtn" aria-label="See church details" style="display: none;">
                    <img src="images/details-section/church.png" alt="Church" class="venue-swap-btn-img">
                </button>
            </div>
            <div class="detail-popup-address" id="churchPopupAddress">
                <p class="detail-popup-address-name">Christ the King Parish</p>
                <p class="detail-popup-address-line">Greenmeadows Avenue, Quezon City</p>
            </div>
        </div>
    </div>

    <!-- Vite Entry Point -->
    <script type="module" src="/src/js/main.js"></script>
</body>
</html>
